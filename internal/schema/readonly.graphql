type BankingPayoutRoute {
	"""
	ISO 4217, uppercase.
	"""
	currency: String!
	rail: BankingFiatRail!
	available: Boolean!
	"""
	Null when `available` is true.
	"""
	unavailableReason: BankingPayoutRouteUnavailableReason
	"""
	The provider that will carry a payout on this route, lowercase, in the same
	vocabulary as `BankingAccount.provider` (for example `seismic`, `dakota`).

	Null when `available` is false, because an unavailable route has no carrier.

	Read this rather than deriving it. It decides which provider's recipient
	contract a route requires -- Seismic's holder-address recipe, and the date
	of birth an individual recipient needs -- and
	`requestBankingFiatWithdraw` freezes its approval against the same
	provider, so a surface that guesses wrong signs an approval the provider
	then refuses. `BankingAccount.provider` is not a substitute: a route
	override is resolved ahead of the account default. Nor is the rail: both
	providers serve every USD rail, so a USD route moved to a linked provider
	is indistinguishable from the default one without this field.

	It is per route, not per account: one currency's rails can be carried by
	different providers at once.
	"""
	provider: String
}
"""
Why a route is not available.

Deliberately product-level. Which provider would carry a route, and whether
the rail-routing and bridged-payout rollout flags are on, are operator facts
that stay in the Ledger admin surface: "no second provider is linked", "rail
routing is off" and "bridged payouts are off" all arrive here as
`RAIL_NOT_AVAILABLE`.
"""
enum BankingPayoutRouteUnavailableReason {
	"""
	The Banking Account is not active, so it cannot pay out at all. Read
	`state` for which stage it is in.
	"""
	ACCOUNT_NOT_ACTIVE
	"""
	Payouts in this currency are not enabled on the account.
	"""
	CURRENCY_NOT_ENABLED
	"""
	No provider available to this account can carry this currency over this
	rail today.
	"""
	RAIL_NOT_AVAILABLE
	"""
	Ledger reported a reason this gateway version does not know. Treat the
	route as unavailable without explaining why; do not infer a cause.
	"""
	UNKNOWN
}
