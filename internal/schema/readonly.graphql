	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: ID!
	"""
	Upstream lifecycle status; a record's presence does not establish settlement or payment.
	"""
	status: StatementExportStatus!
	"""
	Name of an existing statement export file; does not provide download access.
	"""
	fileName: String
	"""
	Number of rows reported by the export task; not a monetary value.
	"""
	rowCount: Int
	"""
	Upstream completedAt timestamp (RFC3339). Preserve its UTC offset; null is unavailable or not yet recorded. Date-window reporting must use the user's timezone.
	"""
	completedAt: Time
	"""
	Upstream createdAt timestamp (RFC3339). Preserve its UTC offset; null is unavailable or not yet recorded. Date-window reporting must use the user's timezone.
	"""
	createdAt: Time!
}
"""
RFC 3339 compliant date-time scalar.
"""
scalar Time
"""
Represents a total aggregation (all assets combined)
"""
type Total {
	"""
	Structural placeholder for the total aggregation; carries no monetary value.
	"""
	_empty: String!
}
"""
A high-level transaction representing a financial operation
"""
type Transaction {
	"""
	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: String!
	"""
	Human-readable reference; distinct from the stable API identifier.
	"""
	humanId: String!
	"""
	Upstream record category. Preserve the exact returned value.
	"""
	type: String!
	"""
	Upstream lifecycle state; a record's presence does not establish settlement or spendability.
	"""
	state: String!
	"""
	Upstream initiatedAt timestamp (RFC3339). Preserve its UTC offset; null is unavailable or not yet recorded. Date-window reporting must use the user's timezone.
	"""
	initiatedAt: Time!
	"""
	Upstream finishedAt timestamp (RFC3339). Preserve its UTC offset; null is unavailable or not yet recorded. Date-window reporting must use the user's timezone.
	"""
	finishedAt: Time
	"""
	Counterparty display/search text; not proof of external ownership or deduplication identity.
	"""
	counterpartyTexts: [String!]!
	"""
	User-entered transaction notes; not authoritative settlement evidence.
	"""
	notes: String
}
"""
Paginated transaction results
"""
type TransactionConnection {
	"""
	Records in this page only. Fetch subsequent pages before claiming complete coverage.
	"""
	transactions: [Transaction!]!
	"""
	Opaque next-page cursor. Pass as after with unchanged filters; null or empty indicates no next page.
	"""
	cursor: String
}
type TreasuryPositionAccount {
	"""
	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: ID!
	"""
	Identifier of the entity that owns this record.
	"""
	entityId: ID!
	"""
	Associated physical vault, including underlying instrument and current product APY.
	"""
	vault: Vault!
	"""
	Current position value in major underlying asset units. Do not divide by instrument decimals again or add different assets.
	"""
	currentValueInAssets: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	investedInUSD: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	currentValueInUSD: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	unrealizedProfitInUSD: String!
}
"""
Aggregate of at most the latest 200 matching Treasury positions. Not a proven full portfolio total; inspect the enclosing field's read_coverage.
"""
type TreasuryPositionAccountSummary {
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	totalEarnedInUSD: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	investedInUSD: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	currentValueInUSD: String!
	"""
	Backend ledger USD minor units; divide by 100 for USD dollars.
	"""
	unrealizedProfitInUSD: String!
	"""
	Position-weighted average of associated vault product APYs, not an average of position utilized APYs. Decimal fraction: 0.05 means 5%; normalized_values.percent is already multiplied by 100.
	"""
	averageAPY: String!
}
"""
Public user information.
"""
type User {
	"""
	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: ID!
	"""
	Display name of this record.
	"""
	name: String!
	"""
	Member email address.
	"""
	email: String!
}
type Vault {
	"""
	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: ID!
	"""
	Display name of this record.
	"""
	name: String!
	"""
	Underlying instrument used to identify asset-denominated Treasury amounts.
	"""
	underlyingInstrument: Instrument!
	"""
	Current product APY quoted for the vault. Preserve the source value, including negative values; do not substitute a position's utilized APY. Decimal fraction: 0.05 means 5%; normalized_values.percent is already multiplied by 100.
	"""
	apy: String!
}
"""
A wallet that can hold multiple blockchain accounts across different networks
"""
type Wallet {
	"""
	Stable upstream identifier. Treat as opaque; do not infer business meaning from its format.
	"""
	id: ID!
	"""
	Human-readable reference; distinct from the stable API identifier.
	"""
	humanId: String!
	"""
	Display name of this record.
	"""
	name: String!
	"""
	Upstream lifecycle state; a record's presence does not establish settlement or spendability.
	"""
	state: WalletState!
	"""
	Upstream wallet valuation; not spendable-source readiness. May overlap entity and instrument totals.
	"""
	totalBalance: Balance!
}
"""
State of a wallet
"""
enum WalletState {
	"""
	State not specified
	"""
	UNSPECIFIED
	"""
	Wallet is being synced after import
	"""
	PENDING
	"""
	Wallet is fully synced and active
	"""
	ACTIVE
}
