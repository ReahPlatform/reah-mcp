enum BankingFiatRail {
	ACH
	WIRE
	SWIFT
	SEPA
	FPS
	BACS
	NPSS
	CNAPS
	FAST
	MEPS
	"""
	United Kingdom CHAPS, the high-value same-day rail alongside `FPS` and `BACS`.

	Unlike `ECG` and `CHATS` below, this is **not** visibility-only. GBP/chaps is
	transactable end-to-end in Ledger: it is admitted by the withdrawal rail
	allowlist (`normalizeBankingFiatWithdrawalRail`), maps to Seismic through
	`seismicRailFromFiatWithdrawalRail`, maps the `gbp_chaps` monetization fee
	target, and is accepted by contact bank account validation on the same terms
	as the other two UK rails (8-digit account number, 6-digit sort code). It was
	unreachable only because this enum had no member for it, so
	`requestBankingFiatWithdraw` and the estimate queries could not name the
	corridor.
	"""
	CHAPS
	"""
	Hong Kong ECG. Visibility only: it appears in the Ledger rail limitation
	catalog and can be stored on a contact bank account, but it is not in Ledger's
	withdrawal rail allowlist, so `requestBankingFiatWithdraw`,
	`estimateBankingFiatRailFee` and both `estimateBankingFiatOfframp*` queries
	fail with `INVALID_ARGUMENT` before fee resolution is ever reached.

	The rail becomes usable only once Ledger admits it in
	`normalizeBankingFiatWithdrawalRail` and `seismicRailFromFiatWithdrawalRail`
	**and** maps an `hkd_ecg` monetization fee target — the fee target alone is
	not enough. Do not offer it as a selectable withdrawal rail before then.
	"""
	ECG
	"""
	Hong Kong CHATS. Visibility only, on the same terms as `ECG`: catalog and
	contact storage today, rejected at Ledger's withdrawal rail allowlist until
	Ledger admits `chats` there and maps an `hkd_chats` fee target.
	"""
	CHATS
}
