	value: String!
	calldata: String!
	calldataHash: String!
	functionSignature: String!
	selector: String!
	"""
	Producer-set decode claims; never render as trusted without independently
	re-decoding calldata and comparing the result.
	"""
	decodedArguments: [ContractArgument!]!
	abiSource: String!
	"""
	Reports only what abiSource claimed when the producer queried it. Consumers
	must confirm verification independently before relying on the ABI.
	"""
	abiVerified: Boolean!
	abiHash: String!
	isProxy: Boolean!
	implementationAddress: String
	runtimeCodeHash: String!
