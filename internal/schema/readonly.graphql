	routePreference: String
	"""
	Zero-fee scheduled convert intent; null for instant converts. The delay
	materially changes the approval: funds park for scheduledDelayDays 24h
	days after execution (behind an on-chain allowance for the outgoing
	direction) and the customer receives scheduledReceiveAmount
	(destination-instrument standard units) off the yield curve instead of
	the instant quote.

	Precedence over the sibling fields when set: scheduledReceiveAmount is
	the authoritative frozen customer amount; amount stays the source
	amount, amountMode reads null (the legacy exact-input default —
	scheduling rides the exact-input flows, which never write a mode),
	requestedTargetAmount stays null, and
	executionConstraint.minimumReceive applied only to the request-time
	instant baseline the curve was priced from.
	"""
	scheduledDelayDays: Int
	scheduledReceiveAmount: String
	"""
	USDG APR (bps) frozen at submit, base-10 like approvedFeeBps; prices the
	fee discount.
	"""
	scheduledFrozenAprBps: String
	"""
	Outgoing only: cancellable until delivery minus this lead.
	"""
	scheduledMinCancelLeadSeconds: Int
	"""
	Notes captured at initiation time
	"""
	notes: String
}
