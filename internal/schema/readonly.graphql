"""
Banking balance availability by eligibility: what a bank withdrawal or card
deposit may spend, and what a banking -> crypto convert may spend. The two
differ, so read the field that matches the flow being sized.
"""
type BankingFundAvailability {
	"""
	Whether holding-period enforcement is active for this account.
	"""
	enforced: Boolean!
	currency: String!
	currencyScale: Int!
	availableAmountMinor: String!
	onHoldAmountMinor: String!
	processingAmountMinor: String!
	"""
	What an `any`-eligibility flow may spend right now: a banking → crypto
	convert, or a Banking-funded Treasury deposit.

	**Size those inputs from this, not from availableAmountMinor +
	onHoldAmountMinor.** A convert may reach an ordinary deposit hold but never a
	scheduled-convert credit, which is the collateral funding its own fee
	discount, and funds already committed to another in-flight transaction have
	left the balance entirely. Offering the wider figure offers money no
	reservation can take: the request is accepted, approvers sign it, and it
	fails at execution.

	availableAmountMinor remains the ceiling for bank transfers and card
	deposits. Only the convert rejects an over-limit amount at request time — a
	Banking-funded Treasury deposit still reserves at execution, so do not read
	this as evidence that flow is guarded.

	**Null means the ledger serving this request does not report it** (any build
	before the field existed), not that nothing is convertible. Fall back to
	availableAmountMinor, which is always less than or equal to this value and so
	cannot over-offer.

	When `enforced` is false the projection is not binding — nothing is rejected
	for exceeding this — so treat it as advisory there rather than as a cap.
	"""
	convertibleAmountMinor: String
	"""
	The part of onHoldAmountMinor that is scheduled-convert collateral, locked
	until its delivery date rather than merely inside a deposit hold. Held funds
	outside this slice ARE convertible to crypto, so copy that tells a customer
	what they can still do with held funds must distinguish the two.

	Null means the ledger serving this request does not report it; treat the hold
	breakdown as unavailable rather than assuming zero collateral, or the copy
	reverts to the claim this field exists to correct.
	"""
	scheduledHeldAmountMinor: String
	asOf: Time!
	nextRelease: BankingFundNextRelease
}
