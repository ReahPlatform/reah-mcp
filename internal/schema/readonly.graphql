Zero-fee scheduled convert details mirrored onto a transaction. Amounts are
standard units of the target instrument.
"""
type ScheduledConvertInfo {
	id: ID!
	direction: ScheduledConvertDirection!
	delayDays: Int!
	deliverAt: Time
	"""
	Scheduled receive amount in target-instrument standard units.
	"""
	scheduledReceiveAmount: String!
	"""
	Effective spread selected for this scheduled delivery, rounded UP to whole
	bps. Prefer appliedFeeBpsExact for display: the ceiling can equal
	marketSpreadBps and make the scheduling bonus read as zero.
	"""
	appliedFeeBps: Int!
	"""
	The same effective spread before that rounding, in decimal bps
	(e.g. "17.1397260273972603"). Ledger derives it from the frozen baseline,
	APR and delay, so older transactions carry it too as long as they froze a
	baseline. Null when there is no baseline to derive from, or when the
	derivation does not reproduce appliedFeeBps -- then only that rounded
	integer is available.
	"""
	appliedFeeBpsExact: String
	"""
	Frozen day-zero market spread before the scheduled-delivery bonus.
	Null for legacy transactions that did not persist the baseline.
	"""
	marketSpreadBps: Int
	"""
	Outgoing only: last instant the scheduled convert may be canceled.
	"""
	cancelDeadline: Time
	"""
	Derived by the ledger from the transaction state plus its cancel marker:
	a canceled convert reads CANCELED even though the underlying transaction
	is terminally failed. This is the only surface exposing the status; the
	authoritative scheduled_converts row stays internal to the ledger.
	"""
	status: ScheduledConvertStatus!
