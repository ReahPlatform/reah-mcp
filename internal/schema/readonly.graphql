"""
The canonical executable inputs are chainId, signerAddress, targetAddress,
value, and calldata. A consumer must treat a missing or unparseable input as
unverifiable; in particular, chainId "0", an empty value, and empty calldata
are unset rather than valid canonical inputs (zero value is "0" and no
calldata is "0x").

Every other field is producer-set display or audit context. Approval clients
must independently decode calldata with an independently obtained ABI and
cross-check any producer-set description before presenting it as verified.
"""
type ContractExecutionDetails {
	v: Int!
	networkId: ID!
	chainId: String!
	chainName: String!
	"""
	Resolve this trusted Ledger identifier and cross-check that both the signer
	address and wallet ID agree; any mismatch is unverifiable.
