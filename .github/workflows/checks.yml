name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: reah-ci-stateless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make lint
      - run: make test
      - run: make build
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Virtual runners validate compilation and contracts, not physical keys.
      - run: make lint test build
