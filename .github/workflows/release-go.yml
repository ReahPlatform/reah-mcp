name: Release Go client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Go client tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-go
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REAH_MCP_UPDATE_URL: https://github.com/ReahPlatform/reah-mcp/releases/latest/download/update.json
      REAH_MCP_UPDATE_PUBLIC_KEY: ${{ vars.REAH_MCP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists; do not overwrite published binaries.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make lint test build
      - name: Require update trust root
        run: test -n "$REAH_MCP_UPDATE_PUBLIC_KEY"
      - run: make release-go VERSION="$RELEASE_TAG"
      - name: Sign update manifest
        run: go run scripts/sign_update.go "dist/go/$RELEASE_TAG"
        env:
          REAH_MCP_UPDATE_SIGNING_SEED: ${{ secrets.REAH_MCP_UPDATE_SIGNING_SEED }}
      - uses: actions/upload-artifact@v4
        with:
          name: go-client
          path: dist/go/${{ inputs.tag }}/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: go-client
          path: release
      - name: Verify checksums and publish
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "Go client $RELEASE_TAG" --generate-notes --draft ./*
